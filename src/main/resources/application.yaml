spring:
  application:
    name: coroutines-concept-io
server:
  port: 8021
app:
  delay-ms: 150 # время задержки для имитации I/O операции
  service-prefix: io
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true